<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DripStat Live</title>
<style>
:root {
  --bg: #eef4f5; --surface: #ffffff; --ink: #0d2228; --ink-2: #47606a; --muted: #6f868d;
  --line: #d3e1e4; --accent: #0b6e7f; --accent-soft: #d9edf1; --ok: #1baf7a;
  --s-claude: #eb6834; --s-chatgpt: #1baf7a; --s-gemini: #2a78d6;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0a1417; --surface: #11212a; --ink: #e5f0f2; --ink-2: #a8bec4; --muted: #7d959c;
    --line: #22373f; --accent: #4fb8c9; --accent-soft: #123640; --ok: #2fc48d;
    --s-claude: #d95926; --s-chatgpt: #199e70; --s-gemini: #3987e5; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { width: 340px; padding: 14px; background: var(--bg); color: var(--ink); font: 13px/1.45 var(--f-body); display: grid; gap: 12px; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }

header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.brand { display: flex; align-items: center; gap: 8px; font: 700 15px/1 var(--f-display); letter-spacing: -0.01em; }
.brand svg { width: 22px; height: 22px; }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--ink-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px; background: var(--surface); }
.status i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); }

.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--accent-soft); border-radius: 9px; padding: 3px; gap: 3px; }
.seg button { font: 500 12px var(--f-body); border: 0; border-radius: 7px; padding: 5px 0; background: transparent; color: var(--ink-2); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .08); }

.hero { display: grid; grid-template-columns: 64px 1fr; gap: 14px; align-items: center; }
.tank svg { display: block; width: 64px; height: 82px; }
.wave { animation: drift 6s linear infinite; }
@keyframes drift { from { transform: translateX(0); } to { transform: translateX(-60px); } }
@media (prefers-reduced-motion: reduce) { .wave { animation: none; } }
.total { font: 700 36px/1 var(--f-display); letter-spacing: -0.02em; margin: 4px 0 6px; font-variant-numeric: tabular-nums; }
.total small { font-size: 15px; font-weight: 500; color: var(--ink-2); margin-left: 4px; letter-spacing: 0; }
.equiv { color: var(--ink-2); }
.equiv b { color: var(--ink); font-weight: 600; }

.svc { display: grid; gap: 10px; }
.svc-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; align-items: baseline; }
.svc-name { display: flex; align-items: center; gap: 7px; font-weight: 500; }
.note { font-size: 11px; font-weight: 400; color: var(--muted); }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.svc-val { text-align: right; }
.svc-val .num { font-weight: 500; }
.svc-sub { grid-column: 1 / -1; display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); }
.bar { grid-column: 1 / -1; height: 5px; border-radius: 3px; background: var(--accent-soft); overflow: hidden; }
.bar span { display: block; height: 100%; border-radius: 3px; transition: width .3s; }

.chart-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
#chart { display: block; width: 100%; height: 74px; overflow: visible; }
.days { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 10.5px; color: var(--muted); margin-top: 4px; }
.days span.today { color: var(--ink); font-weight: 600; }

.actions { display: flex; gap: 8px; }
.btn { flex: 1; font: 500 13px var(--f-body); padding: 8px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; text-align: center; text-decoration: none; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.quiet { flex: 0 0 auto; color: var(--ink-2); }
.btn.quiet[data-confirm] { color: #c0392b; border-color: currentColor; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.foot { font-size: 11px; color: var(--muted); text-align: center; margin: -2px 0 0; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg viewBox="14 10 72 74" aria-hidden="true"><rect x="16" y="58" width="16" height="24" rx="6" fill="var(--line)"/><rect x="42" y="46" width="16" height="36" rx="6" fill="var(--line)"/><rect x="68" y="38" width="16" height="44" rx="6" fill="#1e90ff"/><path d="M76 12C76 12 69 20 69 25a7 7 0 0 0 14 0C83 20 76 12 76 12Z" fill="#1e90ff"/></svg>
    DripStat Live
  </div>
  <span class="status" id="status"><i></i>Counting</span>
</header>

<div class="seg" role="group" aria-label="Time range">
  <button type="button" data-range="today" aria-pressed="true">Today</button>
  <button type="button" data-range="week" aria-pressed="false">7 days</button>
  <button type="button" data-range="all" aria-pressed="false">All time</button>
</div>

<section class="card hero" aria-label="Estimated water">
  <div class="tank" id="tank" aria-hidden="true"></div>
  <div>
    <span class="label" id="heroLabel">Water used today</span>
    <div class="total" id="total">0<small>mL</small></div>
    <div class="equiv" id="equiv"></div>
  </div>
</section>

<section class="card svc" id="services" aria-label="By service"></section>

<section class="card" aria-label="Last 7 days">
  <div class="chart-head"><span class="label">Last 7 days</span><span class="num" id="weekTotal" style="font-size:12px;color:var(--ink-2)"></span></div>
  <svg id="chart" viewBox="0 0 312 74" preserveAspectRatio="none" role="img" aria-label="Water per day by service"></svg>
  <div class="days" id="days"></div>
</section>

<div class="actions">
  <a class="btn primary" href="https://awnsh.github.io/dripstat/app.html" target="_blank" rel="noopener">Open DripStat</a>
  <button type="button" class="btn quiet" id="clear">Clear</button>
</div>
<p class="foot">Estimates use DripStat's cooling + power-plant method. Chat text never leaves this browser.</p>
<script src="popup.js"></script>
</body>
</html>
